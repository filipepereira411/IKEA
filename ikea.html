<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA Inspiration - HTML & CSS</title>
    <style>
        /* RESET & VARIÁVEIS OFICIAIS IKEA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans", Arial, sans-serif;
        }

        :root {
            --azul-ikea: #0051ba;
            --amarelo-ikea: #ffda1a;
            --preto-ikea: #111111;
            --cinza-texto: #484848;
            --cinza-fundo: #f5f5f5;
            --cinza-borda: #dfdfdf;
        }

        body {
            background-color: #ffffff;
            color: var(--preto-ikea);
        }

        /* 1. BARRA DE NOTIFICAÇÕES (TOP BANNER) */
        .top-banner {
            background-color: var(--preto-ikea);
            color: #ffffff;
            font-size: 12px;
            text-align: center;
            padding: 8px 20px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .top-banner a {
            color: #ffffff;
            text-decoration: underline;
            margin-left: 5px;
        }

        /* 2. HEADER PRINCIPAL */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--cinza-borda);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Menu Hambúrguer Minimalista */
        .menu-hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
            cursor: pointer;
            margin-right: 25px;
        }
        .menu-hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--preto-ikea);
            border-radius: 2px;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        /* Logótipo Oficial em CSS Semântico */
        .logo-ikea {
            background-color: var(--azul-ikea);
            padding: 12px 26px;
            display: inline-block;
            border-radius: 50% / 100%; /* Formato Oval Perfeito */
            text-align: center;
            text-decoration: none;
        }
        .logo-ikea span {
            color: var(--amarelo-ikea);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            display: block;
            transform: scaleY(1.3) scaleX(1.1); /* Estica a fonte fielmente */
        }

        /* Barra de Pesquisa Integrada */
        .search-container {
            flex-grow: 1;
            max-width: 700px;
            margin: 0 40px;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 16px 24px 16px 52px;
            border-radius: 50px;
            border: none;
            background-color: var(--cinza-fundo);
            font-size: 15px;
            color: var(--preto-ikea);
            outline: none;
            transition: background-color 0.2s;
        }
        .search-container input:focus {
            background-color: #e5e5e5;
        }
        /* Ícone de lupa simulado em CSS */
        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--cinza-texto);
        }

        /* Ícones da Direita (Perfil, Favoritos, Carrinho) */
        .nav-icons {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            position: relative;
            color: var(--preto-ikea);
            text-decoration: none;
        }
        .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background-color: var(--azul-ikea);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3. MENU DE CATEGORIAS INFERIOR */
        .sub-nav {
            display: flex;
            padding: 12px 40px;
            gap: 25px;
            border-bottom: 1px solid var(--cinza-borda);
            font-size: 14px;
            font-weight: 700;
        }
        .sub-nav a {
            color: var(--preto-ikea);
            text-decoration: none;
        }
        .sub-nav a:hover {
            text-decoration: underline;
        }

        /* 4. CONTEÚDO PRINCIPAL (GRID) */
        main {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .section-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Grid Fiel de Produtos */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 35px;
        }

        .card-produto {
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        /* Placeholder de imagem IKEA */
        .img-wrapper {
            width: 100%;
            height: 280px;
            background-color: var(--cinza-fundo);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .img-wrapper img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        /* Informações do Produto */
        .info-produto {
            padding: 16px 0;
            position: relative;
        }
        .nome-produto {
            font-size: 16px;
            font-weight: 700;
            color: var(--preto-ikea);
            text-transform: uppercase;
        }
        .desc-produto {
            font-size: 14px;
            color: var(--cinza-texto);
            margin: 4px 0 12px 0;
            line-height: 1.4;
        }

        /* Preços no formato Oficial */
        .preco-container {
            display: flex;
            align-items: baseline;
        }
        .preco-moeda {
            font-size: 14px;
            font-weight: 700;
            margin-right: 2px;
        }
        .preco-inteiro {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .preco-decimais {
            font-size: 16px;
            font-weight: 700;
            align-self: flex-start;
            margin-top: 2px;
        }

        /* Botão de Compra Azul no Canto Inferior Direito */
        .btn-adicionar-carrinho {
            position: absolute;
            bottom: 16px;
            right: 0;
            background-color: var(--azul-ikea);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn-adicionar-carrinho:hover {
            background-color: #003e8f;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .search-container { margin: 0 15px; }
            .sub-nav { display: none; } /* Oculta sub-menu em mobile como o original */
            .logo-ikea { padding: 8px 18px; }
            .logo-ikea span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- 1. BARRA DE AVISOS SUPERIOR -->
    <div class="top-banner">
        Junte-se ao IKEA Family. Descontos e vantagens exclusivas membros. <a href="#">Saber mais</a>
    </div>

    <!-- 2. HEADER PRINCIPAL -->
    <header>
        <div class="nav-left">
            <!-- Menu Hambúrguer -->
            <div class="menu-hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <!-- Logótipo Fiel -->
            <a href="#" class="logo-ikea">
                <span>IKEA</span>
            </a>
        </div>

        <!-- Caixa de Busca -->
        <div class="search-container">
            <input type="text" placeholder="O que procura hoje?">
        </div>

        <!-- Ícones Utilitários -->
        <div class="nav-icons">
            <button class="icon-btn" title="Perfil">👤</button>
            <button class="icon-btn" title="Favoritos">❤️ <span class="badge">2</span></button>
            <button class="icon-btn" title="Carrinho de Compras">🛒 <span class="badge">1</span></button>
        </div>
    </header>

    <!-- 3. MENU DE CATEGORIAS -->
    <div class="sub-nav">
        <a href="#">Produtos</a>
        <a href="#">Divisões</a>
        <a href="#">Novidades</a>
        <a href="#">Sustentabilidade</a>
        <a href="#">Promoções</a>
    </div>

    <!-- 4. GRID DE PRODUTOS INSPIRADA NO SHOWROOM -->
    <main>
        <h2 class="section-title">Design democrático para a sua casa</h2>
        
        <div class="grid-produtos">
            <!-- Produto 1 -->
            <div class="card-produto">
                <div class="img-wrapper">
